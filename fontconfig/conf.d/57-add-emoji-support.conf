<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Color emoji in the terminal (alacritty, kitty): Noto Color Emoji is the
    first fallback after JetBrainsMono Nerd Font, which has no emoji. Without
    this, fontconfig's own fallback order put a monochrome Font Awesome or
    DejaVu glyph there instead.

    It is appended AFTER the terminal font, never prepended to everything as
    in 2023: Noto Color Emoji also has digits, `#` and `*` (keycap bases), so
    ahead of a font it replaced those. Here JetBrainsMono still draws every
    glyph it has, and other applications' fonts are left alone.
  -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- The terminal-font alias, for configs that ask for it by that name. -->
  <alias binding="strong">
    <family>terminal-font</family>
    <prefer>
      <family>JetBrainsMonoNL NF</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
