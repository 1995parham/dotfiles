<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Color emoji in the terminal (alacritty, kitty): Noto Color Emoji is the
    first fallback after the terminal font (Maple Mono NF in alacritty, as in
    wezterm; JetBrainsMono Nerd Font in kitty), neither of which has emoji.
    Without this, fontconfig's own fallback order put a monochrome Font
    Awesome or DejaVu glyph there instead. Each terminal font needs its own
    match block: a font that is not listed loses the emoji fallback.

    It is appended AFTER the terminal font, never prepended to everything as
    in 2023: Noto Color Emoji also has digits, `#` and `*` (keycap bases), so
    ahead of a font it replaced those. Here the terminal font still draws every
    glyph it has, and other applications' fonts are left alone.
  -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family">
      <string>Maple Mono NF</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- The terminal-font alias, for configs that ask for it by that name. -->
  <alias binding="strong">
    <family>terminal-font</family>
    <prefer>
      <family>JetBrainsMonoNL NF</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
