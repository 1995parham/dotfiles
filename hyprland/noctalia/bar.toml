# waybar (wayland/waybar) on noctalia: its top, bottom and left bars with the
# same modules, in the cachyos look. https://docs.noctalia.dev/noctalia/bar/
# custom modules run through the tordex/stdout plugin (plugins.toml), whose
# scripts are in ./scripts.

[bar]
order = [ "top", "bottom", "clock" ]

# config.d/top.json, plus noctalia's launcher, notifications and session buttons.
# a transparent bar: widgets sit in pills over the wallpaper, grouped by what they
# are about (capsule groups below), instead of one long run of text.
[bar.top]
position = "top"
center = []
# the window title sits after the workspaces: centred, the wide end section
# ran into it
start = [ "launcher", "workspaces", "submap", "active_window" ]
end = [ "group:status", "group:audio", "group:net", "group:system", "group:power", "group:clock", "tray", "notifications", "session" ]
background_opacity = 0.0
shadow = false
concave_edge_corners = false
margin_edge = 6
margin_ends = 8
radius = 14
scale = 1.10
thickness = 40
widget_spacing = 8

    [[bar.top.capsule_group]]
    id = "status"
    members = [ "lock_keys", "disk" ]
    fill = "#111111"
    foreground = "#ffa500"
    opacity = 0.9
    padding = 10.0
    widget_spacing = 10

    [[bar.top.capsule_group]]
    id = "audio"
    members = [ "media", "volume" ]
    fill = "#111111"
    foreground = "#ffa500"
    opacity = 0.9
    padding = 10.0
    widget_spacing = 10

    [[bar.top.capsule_group]]
    id = "net"
    members = [ "roam", "network", "bluetooth" ]
    fill = "#111111"
    foreground = "#ffa500"
    opacity = 0.9
    padding = 10.0
    widget_spacing = 10

    # cpu, memory and temperature side by side, as waybar has them
    [[bar.top.capsule_group]]
    id = "system"
    members = [ "cpu", "cpu_freq", "memory", "temperature" ]
    fill = "#111111"
    foreground = "#ffa500"
    opacity = 0.9
    padding = 10.0
    widget_spacing = 10

    [[bar.top.capsule_group]]
    id = "power"
    members = [ "brightness", "keyboard_layout", "battery" ]
    fill = "#111111"
    foreground = "#ffa500"
    opacity = 0.9
    padding = 10.0
    widget_spacing = 10

    [[bar.top.capsule_group]]
    id = "clock"
    members = [ "clock", "clock_madrid" ]
    fill = "#ffa500"
    foreground = "#111111"
    widget_spacing = 12
    padding = 12.0

# config.d/bottom.json: dates, the calendar, the couple counters and the
# addresses of our vpn interfaces, transparent like the top bar
[bar.bottom]
position = "bottom"
center = [ "group:couple" ]
end = [ "group:vpn" ]
start = [ "group:dates", "group:tunnels" ]
background_opacity = 0.0
shadow = false
margin_edge = 6
margin_ends = 8
radius = 14
scale = 1.10
thickness = 36
widget_spacing = 8

    [[bar.bottom.capsule_group]]
    id = "dates"
    members = [ "date", "jdate", "khal" ]
    fill = "#111111"
    foreground = "#ffa500"
    opacity = 0.9
    padding = 10.0
    widget_spacing = 14

    [[bar.bottom.capsule_group]]
    id = "tunnels"
    members = [ "ip_alvani", "ip_home" ]
    fill = "#111111"
    foreground = "#ffa500"
    opacity = 0.9
    padding = 10.0
    widget_spacing = 14

    [[bar.bottom.capsule_group]]
    id = "couple"
    members = [ "relationship", "birthday" ]
    fill = "#111111"
    foreground = "#ffa500"
    opacity = 0.9
    padding = 10.0
    widget_spacing = 14

    [[bar.bottom.capsule_group]]
    id = "vpn"
    members = [ "ip_speedify", "ip_xvpn", "ip_nobitex" ]
    fill = "#111111"
    foreground = "#ffa500"
    opacity = 0.9
    padding = 10.0
    widget_spacing = 14

# config.d/left.json: a vertical clock on the HDMI-A-1 monitor only
[bar.clock]
position = "left"
enabled = false
center = [ "clock_irst" ]
thickness = 50

    [bar.clock.monitor.hdmi]
    match = "HDMI-A-1"
    enabled = true

################
#### TOP BAR ###
################

[widget.launcher]
capsule = true
capsule_fill = "#111111"
capsule_foreground = "#ffa500"
capsule_opacity = 0.9

[widget.workspaces]
active_pill_size = 2.5
capsule = true
capsule_fill = "#111111"
inactive_pill_size = 1.0
pill_scale = 0.80
# sway's workspace names (hypr/config/variables.lua)
show_labels = true
label_source = "name"
max_label_chars = 8

# waybar's sway/mode and hyprland/submap
[widget.submap]
type = "k4n4t4/hypr-submap:hypr-submap"
hide_when_default = true

[widget.active_window]
capsule = true
capsule_fill = "#111111"
capsule_foreground = "#ffa500"
capsule_opacity = 0.9
title_scroll = "on_hover"
max_length = 360

# keyboard-state
[widget.lock_keys]
show_caps_lock = true
show_num_lock = true

# disk: "{path}: {used} / {total}"
[widget.disk]
type = "sysmon"
stat = "disk_used"
path = "/"
visualization = "none"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

# the roaming sing-box tunnel (keys hosts/simorgh/roam): the German flag while
# a request gets through it, a red cross when it does not, hidden when stopped
[widget.roam]
type = "tordex/stdout:bar"
cmd = "~/.config/noctalia/scripts/roam.sh"
interval = 30
interval_units = "1"
json = true
hide_on_error = true

# pulseaudio
[widget.volume]
show_label = true

# network#eth and network#wifi
[widget.network]

[widget.bluetooth]
show_label = true

# cpu: "{usage}% {avg_frequency}GHz"
[widget.cpu]
type = "sysmon"
stat = "cpu_usage"

[widget.cpu_freq]
type = "sysmon"
stat = "cpu_freq"
visualization = "none"

# memory: "{percentage}%"
[widget.memory]
type = "sysmon"
stat = "ram_pct"

[widget.temperature]
type = "sysmon"
stat = "cpu_temp"

# backlight
[widget.brightness]
show_label = true

# sway/language
[widget.keyboard_layout]
display = "short"

# battery: "{capacity}% ({power})"
[widget.battery]
show_label = true

# clock: "{:%H:%M %Z}", the long form on hover
[widget.clock]
format = "{:%H:%M %Z}"
tooltip_format = "{:%A, %B %d, %Y (%R) %Z}"

# the time in Madrid beside it
[widget.clock_madrid]
type = "clock"
timezone = "Europe/Madrid"
format = "{:%H:%M} Madrid"
tooltip_format = "{:%A, %B %d, %Y (%R) %Z} in Madrid"

[widget.tray]
capsule = true
capsule_fill = "#111111"
capsule_foreground = "#ffa500"
capsule_opacity = 0.9

[widget.notifications]
capsule = true
capsule_fill = "#111111"
capsule_foreground = "#ffa500"
capsule_opacity = 0.9

[widget.session]
capsule = true
capsule_fill = "#111111"
capsule_foreground = "#ffa500"
capsule_opacity = 0.9
color = "error"

###################
#### BOTTOM BAR ###
###################

# custom/date
[widget.date]
type = "clock"
format = "{:%d %B %Y}"

# custom/jdate, jdate comes with the env script
[widget.jdate]
type = "tordex/stdout:bar"
cmd = "jdate +'%d %B %Y'"
interval = 1
interval_units = "3600"
ok_glyph = "calendar"
hide_on_error = true

# custom/khal: today's first event, the week in the tooltip
[widget.khal]
type = "tordex/stdout:bar"
cmd = "~/.config/noctalia/scripts/khal.sh"
interval = 5
interval_units = "60"
json = true
hide_on_error = true

# custom/love#relationship and #birthday (#departure has no case in
# couple.sh, so it printed nothing)
[widget.relationship]
type = "tordex/stdout:bar"
cmd = "~/.config/noctalia/scripts/couple.sh relationship"
interval = 1
interval_units = "3600"
ok_glyph = "heart"

[widget.birthday]
type = "tordex/stdout:bar"
cmd = "~/.config/noctalia/scripts/couple.sh birthday"
interval = 1
interval_units = "3600"
ok_glyph = "cake"

# network#alvani, #home, #speedify, #xvpn and #easynet: hidden while the
# interface is down
[widget.ip_alvani]
type = "tordex/stdout:bar"
cmd = "~/.config/noctalia/scripts/ifaddr.sh alvani"
interval = 10
interval_units = "1"
ok_glyph = "lock"
hide_on_error = true

[widget.ip_home]
type = "tordex/stdout:bar"
cmd = "~/.config/noctalia/scripts/ifaddr.sh home"
interval = 10
interval_units = "1"
ok_glyph = "home"
hide_on_error = true

[widget.ip_speedify]
type = "tordex/stdout:bar"
cmd = "~/.config/noctalia/scripts/ifaddr.sh -n connectify0"
interval = 10
interval_units = "1"
ok_glyph = "world"
hide_on_error = true

[widget.ip_xvpn]
type = "tordex/stdout:bar"
cmd = "~/.config/noctalia/scripts/ifaddr.sh -n 'xvpn-*'"
interval = 10
interval_units = "1"
ok_glyph = "world"
hide_on_error = true

[widget.ip_nobitex]
type = "tordex/stdout:bar"
cmd = "~/.config/noctalia/scripts/ifaddr.sh -n nobitex"
interval = 10
interval_units = "1"
ok_glyph = "world"
hide_on_error = true

#################
#### LEFT BAR ###
#################

# clock: "{:%H:%M}\nIRST"
[widget.clock_irst]
type = "clock"
timezone = "Asia/Tehran"
vertical_format = "{:%H\n%M}\nIRST"
