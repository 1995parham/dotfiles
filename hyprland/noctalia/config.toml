# cachyos-hypr-noctalia's shell settings. the rest of our sway setup lives
# next to it, noctalia reads every *.toml here:
#   bar.toml           waybar
#   notifications.toml dunst
#   launcher.toml      rofi
#   wallpaper.toml     swaybg and swaylock
#   idle.toml          swayidle
#   plugins.toml       the community plugins bar.toml uses

[accessibility]
ui_scale = 1.0

[shell]
clipboard_image_action_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = false

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
mode = "dark"
source = "wallpaper"
# vibrant, not the default m3-tonal-spot: tonal-spot greys the accents and
# surfaces out, vibrant keeps the wallpaper's own saturated colors
wallpaper_scheme = "vibrant"

    # no kitty or alacritty: their configs are ours (scripts/kitty.sh,
    # scripts/alacritty.sh link them from here), and noctalia's templates edit
    # the config file in place -- they rewrote both inside this repo, and left
    # alacritty.toml unparsable.
    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "qt" ]
