# vim: set ft=tmux:
# Tmux color scheme configuration

# clock mode (prefix + t): 24-hour format in cyan
set -g clock-mode-style 24
set -g clock-mode-colour colour87 #cyan

# the terminal is always dark (naz, #323232), but Ghostty's client is detected
# as light, and then the theme* colours (the popup background, the command
# prompt) come from the light set: a mid-grey popup on a dark terminal.
# Force the dark set (tmux 3.8+; -q keeps older versions quiet).
set-option -sq theme dark

# status bar colors
set-option -g status-style bg=colour235,fg=colour118

# window title colors: the window formats (status-bar.conf) set their own
setw -g window-status-style default
setw -g window-status-current-style default

# pane border colors
set-option -g pane-border-style fg=colour240
set-option -g pane-active-border-style fg=#ff7fd3

# show indicators for synchronized panes and zoomed state
set-option -g pane-border-indicators both

# command prompt and message colors. Since tmux 3.7 a message covers only its
# own text unless the style has a fill; the condition is the one of the default
# style: fill the status line, but not a prompt opened inside a pane or a mode.
set-option -g message-style 'bg=colour235,fg=colour165,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=colour235}'

# menu styling (tmux 3.4+)
set-option -g menu-style bg=colour235,fg=colour165
set-option -g menu-border-style fg=colour198
# highlighted menu item (tmux 3.4+)
set-option -g menu-selected-style 'bg=colour198,fg=colour235,bold'

# pane scrollbar styling (tmux 3.6+)
set-option -g pane-scrollbars-style 'bg=colour238,fg=colour198,width=1'

# copy-mode line numbers (tmux 3.6+)
set-option -g copy-mode-line-numbers hybrid
set-option -g copy-mode-current-line-number-style 'fg=colour198,bold'

# the line of the cursor in copy mode (tmux 3.8+)
set-option -g copy-mode-current-line-style 'bg=colour237'

# tree mode (prefix + w) selection, which covers the whole line, and the
# characters matched in switch mode (prefix + Tab / S-Tab) (tmux 3.8+)
set-option -g tree-mode-selection-style 'bg=colour198,fg=colour235,bold'
set-option -g switch-mode-match-style 'fg=colour198,bold'

# pane number display colors (prefix + q)
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange
