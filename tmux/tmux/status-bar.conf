# vim: set ft=tmux:
# Tmux status bar configuration

# enable status bar with 4 lines
set -g status 4

# The look of every line: the status background (colors.conf) with rounded
# "pills" (the Nerd Font half circles U+E0B6 and U+E0B4 around a coloured
# block) for the things that name something, and plain coloured text with a
# Nerd Font icon for the rest. The palette is the pastel one of the clocks:
# pink #ff7fd3, yellow #ffd27f, cyan #66d9ef, green #d2fc9e, purple #c89efc,
# peach #ffce9d. Inside a #{?...} condition the attributes of a style are
# separated with spaces, because a comma ends the branch.

# pane border title at top: the pane number as a pill (pink for the active
# pane, grey for the others), then the mode of the pane or its title
set-option -g pane-border-status top
set-option -g pane-border-format "#{?pane_active,#[fg=#ff7fd3],#[fg=colour240]}#[reverse bold] #P #[noreverse nobold] #{?pane_in_mode,#[italics] #{pane_mode}#[noitalics],#T} "

# then the state of the pane's last shell command, from its OSC 133 marks
# (tmux 3.8+): a mark while it runs, the exit status when it failed, and how
# long it took when that was 10 seconds or more. Empty for a shell that does
# not send the marks.
set-option -ag pane-border-format "#{?pane_command_running,#[fg=#E6DB74]… ,#{?#{&&:#{!=:#{pane_command_status},},#{!=:#{pane_command_status},0}},#[fg=#E73C50]✗ #{pane_command_status} ,}#{?#{>=:#{pane_command_duration},10},#[fg=#66D9EF]#{pane_command_duration}s ,}}#[default]"

# heavy lines for pane borders
set -g pane-border-lines heavy

# status line 0: the window list on the left. On the right a yellow PREFIX pill
# while tmux waits for the key after the prefix, and the battery (battery.sh
# sets its colour from the level). The script runs once per status-interval.
set -g status-left ' '
set -g status-right "#{?client_prefix,#[fg=#ffd27f]#[fg=colour235 bg=#ffd27f bold]   PREFIX #[fg=#ffd27f bg=default nobold]  ,}#(battery.sh) "
set -g status-right-length 60

# status line 1: on the left the session as a cyan pill, the window index and
# count, and the help hints; in the centre the time and the date of this host;
# on the right the hostname as a purple pill
set -g status-format[1] "#[align=left] #[fg=#66d9ef]#[fg=colour235 bg=#66d9ef bold]   #S #[fg=#66d9ef bg=default nobold]  #[fg=#d2fc9e]  #I/#{session_windows}   #[fg=colour244 italics]prefix + w  ·  prefix + ?#[noitalics]"
set -ag status-format[1] "#[align=centre fg=#ffe66d]  %H:%M #[fg=colour244]· #[fg=#ffe66d]%a %d %b %Y"
set -ag status-format[1] "#[align=right]#[fg=#c89efc]#[fg=colour235 bg=#c89efc bold]   #h #[fg=#c89efc bg=default nobold] "

# status line 2: session start time, location, and uptime
set -g status-format[2] "#[align=left fg=#9d9dff]   since #{t:session_created}#[align=centre fg=#ff7f9d]  #(whereami.sh)#[align=right fg=#9dffce]  #(uptime.sh) "

# status line 3: in the centre the platform label as a peach pill, then the
# Madrid date (Gregorian and Jalali) and the Tehran, Madrid and US Eastern
# clocks, each in its own colour (worldclock.sh sets them). This is the right
# status WezTerm drew in Lua; Ghostty has no status bar, so it lives here. The
# line is always there. A platform config sets @status-label (MacOS, or SSH in
# an SSH session) and appends its right side (VPNs, network interfaces); with
# no label the line shows the date and the clocks only.
set -g @status-label ''
set -g status-format[3] "#[align=centre]#{?@status-label,#[fg=#ffce9d]#[fg=colour235 bg=#ffce9d bold] #{@status-label} #[fg=#ffce9d bg=default nobold]   ,}#(worldclock.sh)"

# status-left is unused
set -g status-left-length 2

# align window list to the left
set -g status-justify 'left'

# window list separator
setw -g window-status-separator ' '

# the marks after a window name: the pane count when the window has more than
# one pane, a zoomed pane, synchronized panes, a bell, and "-" for the last
# window (prefix + l)
# active window: the index on pink, the name in naz orange on grey
setw -g window-status-current-format "#[fg=#ff7fd3 bg=default]#[fg=colour235 bg=#ff7fd3 bold] #I #[fg=#ff7fd3 bg=colour238 nobold] #[fg=#FD9720]#W#{?#{>:#{window_panes},1}, #[fg=colour250] #{window_panes},}#{?window_zoomed_flag, #[fg=#ffd27f],}#{?pane_synchronized, #[fg=#66d9ef],} #[fg=colour238 bg=default]"

# inactive windows: the same shape in grey, the name in a darker orange
setw -g window-status-format "#[fg=colour237 bg=default]#[fg=colour246 bg=colour237] #I  #[fg=colour172]#W#{?#{>:#{window_panes},1}, #[fg=colour244] #{window_panes},}#{?window_zoomed_flag, #[fg=#ffd27f],}#{?window_bell_flag, #[fg=#ff5c7a],}#{?window_last_flag, #[fg=colour244]-,} #[fg=colour237 bg=default]"

# set terminal title to hostname and session name
set -g set-titles on
set -g set-titles-string '#h : #S'

# bell notification styling
set-window-option -g window-status-bell-style "fg=colour235 bg=colour160" #base02, red
