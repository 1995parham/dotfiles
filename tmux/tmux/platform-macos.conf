# vim: set ft=tmux:
# macOS-specific tmux configuration

# extend status bar to 4 lines for macOS
set -g status 4

# status line 3: VPN connection status (launchd OpenVPN services, the Baly
# tunnel, plus the active home tunnel with live 🏠/🇮🇷/🌍
# reachability badges and the last throughput sample, from tunnel-badge.sh)
#
# tunnel-badge.sh replaced wg-badge.sh when the house moved to sing-box: the old
# one detected wg-quick only, so it printed nothing at all once WireGuard was
# down, which reads identically to "no tunnel" on a line whose whole job is to
# say which tunnel is up. The throughput figure in brackets is read from
# iran-perf.sh's cache (never measured here -- that would put a multi-megabyte
# download behind every status refresh) and is suffixed with ? when stale.
#
# Baly is an on-demand OpenVPN (vpn-baly from the keys repo) with Google SSO, so
# it is not a launchd service to probe either. Match on the route it pushes for
# 10.40/16 (GitLab and its registry): nothing else here routes that range, and
# netstat needs no root. It replaced the Snapp DC tunnel, dead since 2026-10-12.
set -g status-format[3] \
"#[align=right, fg=#9dffce] \
#(netstat -rnf inet 2>/dev/null | awk '$1 == \"10.40/16\" && \$NF ~ /^utun/ {print \"baly \"; exit}') \
#[fg=#1e90ff] \
#(launchctl print system/com.openvpn.aut 2>/dev/null | grep -q 'state = running' && echo "aut") \
#[fg=#ffd27f] \
#(launchctl print system/com.openvpn.home 2>/dev/null | grep -q 'state = running' && echo "home") \
#(launchctl print system/com.openvpn.iran 2>/dev/null | grep -q 'state = running' && echo "iran") \
#[fg=#c3a6ff] \
#(tunnel-badge.sh) \
#[fg=#96ded1] \
#(launchctl print system/com.openvpn.swif-ai 2>/dev/null | grep -q 'state = running' && echo "swif-ai") \
#[align=centre, fg=#ffce9d, bold] MacOS #[align=left, fg=#9d9dff]"
