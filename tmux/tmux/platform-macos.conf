# vim: set ft=tmux:
# macOS-specific tmux configuration

# extend status bar to 4 lines for macOS
set -g status 4

# status line 3: VPN connection status (launchd OpenConnect/OpenVPN services, plus the
# active wg-quick tunnel with live 🏠/🇮🇷/🌍 reachability badges from wg-badge.sh)
#
# snapp-dc is the Cisco Secure Client (AnyConnect) gateway. It replaced snapp1
# (Asiatech), snapp2 (Afranet) and snapp-office (staging) when FortiClient VPN
# access was switched off on 2026-09-13.
set -g status-format[3] \
"#[align=right, fg=#9dffce] \
#(launchctl print system/com.openconnect.snapp-dc 2>/dev/null | grep -q 'state = running' && echo "snapp-dc") \
#[fg=#00bfff] \
#(launchctl print system/com.openconnect.pirouz 2>/dev/null | grep -q 'state = running' && echo "pirouz") \
#[fg=#1e90ff] \
#(launchctl print system/com.openvpn.aut 2>/dev/null | grep -q 'state = running' && echo "aut") \
#[fg=#ffd27f] \
#(launchctl print system/com.openvpn.home 2>/dev/null | grep -q 'state = running' && echo "home") \
#(launchctl print system/com.openvpn.iran 2>/dev/null | grep -q 'state = running' && echo "iran") \
#[fg=#c3a6ff] \
#(wg-badge.sh) \
#[fg=#96ded1] \
#(launchctl print system/com.openvpn.swif-ai 2>/dev/null | grep -q 'state = running' && echo "swif-ai") \
#[align=centre, fg=#ffce9d, bold] MacOS #[align=left, fg=#9d9dff]"
