# vim: set ft=tmux:
# macOS-specific tmux configuration

# extend status bar to 4 lines for macOS
set -g status 4

# status line 3: VPN connection status (launchd OpenVPN services, the Cisco
# Secure Client tunnel, plus the active wg-quick tunnel with live 🏠/🇮🇷/🌍
# reachability badges from wg-badge.sh)
#
# Snapp is on Cisco Secure Client since 2026-09-13 -- the FortiGates were switched
# off and their replacement enforces ISE posture, which openconnect cannot satisfy.
# Secure Client is not a launchd service to probe (its daemon is an SMAppService
# inside the app bundle) and its state files under /opt/cisco/secureclient/vpn are
# root-only, so match on the tunnel address instead: it takes 10.2x.100.x from the
# Snapp pool, which collides with nothing else here -- wg-quick uses 192.168.7.x
# and Speedify 10.202.0.2.
set -g status-format[3] \
"#[align=right, fg=#9dffce] \
#(ifconfig 2>/dev/null | awk '/inet 10\.2[0-9]\.100\./ {print \"snapp-dc: \"$2\" \"}') \
#[fg=#1e90ff] \
#(launchctl print system/com.openvpn.aut 2>/dev/null | grep -q 'state = running' && echo "aut") \
#[fg=#ffd27f] \
#(launchctl print system/com.openvpn.home 2>/dev/null | grep -q 'state = running' && echo "home") \
#(launchctl print system/com.openvpn.iran 2>/dev/null | grep -q 'state = running' && echo "iran") \
#[fg=#c3a6ff] \
#(wg-badge.sh) \
#[fg=#96ded1] \
#(launchctl print system/com.openvpn.swif-ai 2>/dev/null | grep -q 'state = running' && echo "swif-ai") \
#[align=centre, fg=#ffce9d, bold] MacOS #[align=left, fg=#9d9dff]"
