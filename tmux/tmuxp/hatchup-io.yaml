---
session_name: Hatchup IO
windows:
    - window_name: scratch 📝
      layout: tiled
      start_directory: ~/Downloads
      panes:
          - shell_command:
                - chafa $DOTFILES_ROOT/companies/hatchup-io.png --size 80 --clear -f symbols | less
          - focus: true
          - pane
          - pane

    - window_name: hatchup 🐣🚀
      layout: tiled
      start_directory: ~/Documents/Git/Hatchup
      focus: true
      panes:
          - shell_command:
                - figlet 'Hatch it up' | lolcat -S 57
          - pane
          - pane
          - shell_command:
                - nvim
            focus: true
