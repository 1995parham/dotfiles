---
session_name: Main
windows:
    - window_name: dotfiles 🔨
      layout: tiled
      panes:
          - start_directory: ~/dotfiles
            focus: true
            shell_command:
                - tmux resize-pane -Z
                - git pull origin main &> /dev/null
                - fastfetch
          - start_directory: ~/.config/nvim/
            shell_command:
                - git pull origin main &> /dev/null
                - figlet 'I love neovim' | lolcat -S 57
          - start_directory: ~/Documents/Git/parham/keys
            shell_command:
                - git pull origin main &> /dev/null
                - figlet 'Keep your love life private' | lolcat -S 57
          - shell_command:
                - cd "$(navi info cheats-path)/1995parham__cheats"
                - git pull origin main &> /dev/null
                - figlet 'I cannot remember anything' | lolcat -S 57

    - window_name: scratch 📝
      layout: tiled
      start_directory: ~/Downloads
      focus: true
      panes:
          - shell_command:
                - chafa $DOTFILES_ROOT/companies/nobitex.png --size 80 --clear -f symbols | less
          - focus: true
          - pane
          - pane

    - window_name: scratch 📝
      layout: tiled
      start_directory: ~/Downloads
      panes:
          - pane
          - pane
          - pane
          - pane

    - window_name: nobi 🔥
      layout: tiled
      panes:
          - start_directory: ~/Documents/Git/parham/keys/vpn/nobitex
          - start_directory: ~/Documents/Git/parham/keys/vpn/nobitex
          - start_directory: ~/Documents/Git/parham/keys/vpn/nobitex
          - start_directory: ~/Documents/Git/parham/keys/vpn/nobitex
          - start_directory: ~/Downloads

    # gerrit/production: ansible + terraform (vault) + the SRE charts
    - window_name: production 🚀
      layout: tiled
      start_directory: ~/Documents/Git/nobitex/gerrit/production
      panes:
          - shell_command:
                - git status -sb
          - pane
          - pane
          - pane

    # code/blockchain/production: signer, asset-flow, hot-wallet, payment-gateway
    - window_name: blockchain ₿
      layout: tiled
      start_directory: ~/Documents/Git/nobitex/code/blockchain/production
      panes:
          - shell_command:
                - git status -sb
          - pane
          - pane
          - pane

    - window_name: nobitex 🧳
      layout: tiled
      start_directory: ~/Documents/Git/nobitex/code/nobitex/nobitex
      panes:
          - shell_command:
                - git status -sb
          - pane
          - pane
          - pane

    - window_name: front-next 🎨
      layout: tiled
      start_directory: ~/Documents/Git/nobitex/code/nobitex/front-next
      panes:
          - shell_command:
                - git status -sb
          - pane
          - pane
          - pane
