[general]
live_config_reload = true

[env]
COLORTERM = "truecolor"

[terminal]
# let programs (nvim, tmux, ssh sessions) read and write the system clipboard
osc52 = "CopyPaste"

[window]
padding = { x = 12, y = 10 }
dynamic_padding = true
opacity = 0.96
blur = true
option_as_alt = "OnlyLeft"

[scrolling]
history = 50000
multiplier = 3

# Same face as wezterm/wezterm.lua: Maple Mono NF Medium at 10.5, with bold
# and italics from the same family. Nerd Font glyphs are baked in, so prompt
# and tmux icons render without a fallback. alacritty does no ligature shaping
# and has no OpenType feature option, so wezterm's calt ligatures and the cv04
# `l` are not available here.
# emoji fall back to Noto Color Emoji through fontconfig (fontconfig/conf.d/
# 57-add-emoji-support.conf) on Linux and Apple Color Emoji on macOS; alacritty
# has no fallback-font option of its own
[font]
builtin_box_drawing = true
size = 10.5

[font.normal]
family = "Maple Mono NF"
style = "Medium"

[font.bold]
family = "Maple Mono NF"
style = "Bold"

[font.italic]
family = "Maple Mono NF"
style = "Medium Italic"

[font.bold_italic]
family = "Maple Mono NF"
style = "Bold Italic"

[cursor]
unfocused_hollow = true
thickness = 0.2
style = { shape = "Beam", blinking = "On" }
vi_mode_style = { shape = "Block", blinking = "Off" }
blink_interval = 600
blink_timeout = 10

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

# naz (1995parham/naz.vim), the same palette as wezterm/wezterm.lua, so vim
# blends into the terminal: #323232 base, pink #F92772 accent, deep-sky-blue
# functions, aqua types
[colors]
draw_bold_text_with_bright_colors = false
transparent_background_colors = true

[colors.primary]
background = "#323232"
foreground = "#E8E8E3"
bright_foreground = "#FFFFFF"

[colors.cursor]
text = "#323232"
cursor = "#F92772"

[colors.vi_mode_cursor]
text = "#323232"
cursor = "#EE82EE"

[colors.selection]
text = "#E8E8E3"
background = "#575B61"

[colors.search.matches]
foreground = "#323232"
background = "#FD9720"

[colors.search.focused_match]
foreground = "#323232"
background = "#F92772"

[colors.hints.start]
foreground = "#323232"
background = "#FD9720"

[colors.hints.end]
foreground = "#E8E8E3"
background = "#00BFFF"

[colors.footer_bar]
foreground = "#66D9EF"
background = "#262626"

[colors.line_indicator]
foreground = "#323232"
background = "#F92772"

[colors.normal]
black = "#211F1C"
red = "#E73C50"
green = "#8AD000"
yellow = "#E6DB74"
blue = "#00BFFF"
magenta = "#F92772"
cyan = "#66D9EF"
white = "#E8E8E3"

[colors.bright]
black = "#575B61"
red = "#FF6347"
green = "#7FFF00"
yellow = "#FD9720"
blue = "#198CFF"
magenta = "#EE82EE"
cyan = "#00CED1"
white = "#FFFFFF"

# font zoom on Control (Linux) and Command (macOS) is built in;
# only the bindings alacritty does not ship are listed here
[[keyboard.bindings]]
action = "SelectNextTab"
key = "Right"
mods = "Command"

[[keyboard.bindings]]
action = "SelectPreviousTab"
key = "Left"
mods = "Command"
