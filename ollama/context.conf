# ollama's default context is too small for a coding agent: opencode's system
# prompt and tool definitions alone fill it, and the model then drops the tool
# calls. 32k fits qwen3:8b with room to spare in 32 GB.
#
# ollama also skips an integrated gpu (intel arc on simorgh) unless told to,
# and then runs on the cpu only.
[Service]
Environment=OLLAMA_CONTEXT_LENGTH=32768
Environment=OLLAMA_IGPU_ENABLE=1
