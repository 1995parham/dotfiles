# /tmp is a RAM-backed tmpfs with a per-user quota (systemd's tmp.mount ships
# usrquota), so anything left here is held in memory and counts against that
# quota. The system-wide rule in /usr/lib/tmpfiles.d/tmp.conf only ages /tmp out
# after 10d, which is far too slow once agent scratchpads start holding repo
# clones and build trees (cargo target/, node_modules, downloaded binaries).

# Type Path                      Mode User Group Age Argument
  e    "/tmp/claude-%U/*"        -    -    -     3d  -
  e    "/tmp/.pnpm-store"        -    -    -     3d  -
  e    "/tmp/node-compile-cache" -    -    -     3d  -
