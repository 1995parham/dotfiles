; vim: set ft=gitconfig:

[alias]
  ignore = "!gi() { IFS=","; curl -L -s "https://www.toptal.com/developers/gitignore/api/$*";}; gi"
  ; delete the local branches whose upstream branch is gone, on every remote.
  ; a branch that is checked out (here or in another worktree) is kept. use -n for a dry run.
  prune-branches = "!f() { \
    git fetch --all --prune --quiet || return; \
    gone=$(git for-each-ref refs/heads --omit-empty --format='%(if:equals=[gone])%(upstream:track)%(then)%(if)%(worktreepath)%(then)%(else)%(refname:short)%(end)%(end)'); \
    if [ -z \"$gone\" ]; then echo 'no branch to prune'; return; fi; \
    if [ \"$1\" = -n ]; then echo \"$gone\"; else echo \"$gone\" | xargs git branch -D; fi; \
  }; f"
  project = "!which onefetch && onefetch; which tokei && tokei"
  ci = "!git commit -vv --date="$(date -u +%Y-%m-%dT%H:%M:%S%z)""
  reauthor = "!git filter-branch -f --env-filter 'GIT_AUTHOR_NAME=\"Parham Alvani\"; GIT_AUTHOR_EMAIL=\"parham.alvani@gmail.com\"; GIT_COMMITTER_NAME=\"Parham Alvani\"; GIT_COMMITTER_EMAIL=\"parham.alvani@gmail.com\"' HEAD"
